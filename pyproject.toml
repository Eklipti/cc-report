[project]
name = "cc-report"
version = "0.1.0"
description = "Script for generating reports from CSV files"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argparse>=1.4.0",
    "pathlib>=1.0.1",
    "statistics>=1.0.3.5",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
]

[tool.ruff]
line-length = 120
target-version = "py313"
[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "PTH",
    "RET",
    "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003"]
[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_return_any = true
warn_unreachable = true
ignore_missing_imports = true

[tool.setuptools]
packages = []
